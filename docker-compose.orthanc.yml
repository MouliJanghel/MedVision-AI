
services:
  orthanc:
    image: orthancteam/orthanc:26.9.0
    container_name: medvision-orthanc
    restart: unless-stopped
    ports:
      - "127.0.0.1:8042:8042"
      - "127.0.0.1:4242:4242"
    environment:
      ORTHANC_NAME: "MedVision-AI DICOM Server"
      ORTHANC__REMOTE_ACCESS_ALLOWED: "true"
      ORTHANC__AUTHENTICATION_ENABLED: "true"
      ORTHANC__REGISTERED_USERS: '{"admin":"${ORTHANC_PASSWORD}"}'
    volumes:
      - orthanc-storage:/var/lib/orthanc/db

volumes:
  orthanc-storage:
